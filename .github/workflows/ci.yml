name: CI

# Quality gate for every PR and every master push. Deploy is handled separately
# by deploy.yml; this workflow runs all three test suites (frontend, contact
# backend, portfolio-builder script) so nothing merges without them passing.
on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend (check + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx astro check
      - name: Unit tests (vitest)
        run: npm test
      # Build from the committed generated/projects.ts (no network sync) so the
      # check is deterministic; deploy.yml runs the full `npm run build` with sync.
      - name: Build
        run: npx astro build
      # Fast, network-free check that no self-hosted asset reference is missing
      # (the original broken og:image class). Full external-link sweep runs
      # weekly in link-check.yml.
      - name: Verify self-hosted assets
        run: node scripts/check-links.mjs --assets-only
      # Structural HTML-quality gate (heading outline, alt text, lang, in-page
      # anchors, target=_blank safety) — catches defects that only surface in
      # the final composed document. Caught the #89 h2-before-h1 regression.
      - name: Audit built HTML
        run: node scripts/audit-html.mjs

  backend:
    name: contact backend (node --test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Backend tests
        run: npm test

  scripts:
    name: portfolio builder (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Script tests
        run: python -m unittest discover -s tests
